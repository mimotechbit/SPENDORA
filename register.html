<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - page </title>
    <link rel="stylesheet" href="css/register.css">
</head>
<body>


   <form action="">
    <legend>JOIN US AND GET STARTED</legend>
    
    <br><br>

    <label for="fullname">FULL NAME</label>
    <input type="text" placeholder="eg JOHN DOE"  id="fullname" required> <br><br>
     
    <label for="email">Email Adress</label>
    <input class="mimo" type="email" placeholder=" eg abc@gmail.com" id="emailadress" required>
     <br><br>

    <label for="pwd">password</label>
    <input class="mimo" type="password"  placeholder="password" id="pwd" required>
<br><br>
    <label for="birthday">BIRTHDAY</label>
    <input type="date"  id="birthday" required>
    <br><br>

     <label for="dt">date & time</label>
    <input type="datetime-local"  id="dt" required>
     <br>
      <label for="contacts">phone no</label>
    <input type="file"  id="contacts" required>


<br><br>
<button>Register</button>





   </form> 



















</body>
</html>
